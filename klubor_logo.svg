<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B22"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#2EA8FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bg)"/>

  <!-- Yarn / Klubok symbol -->
  <g transform="translate(600,420)" stroke="url(#grad)" stroke-width="18" fill="none" filter="url(#glow)">
    <circle r="145" opacity="0.15"/>
    <path d="M-110,-60 C-40,-130,40,-130,110,-60"/>
    <path d="M-120,-20 C-40,-90,40,-90,120,-20"/>
    <path d="M-125,20 C-40,-40,40,-40,125,20"/>
    <path d="M-115,65 C-35,5,35,5,115,65"/>
    <path d="M-80,-120 C-20,-30,20,30,80,120"/>
    <path d="M80,-120 C20,-30,-20,30,-80,120"/>
    <path d="M90,110 C160,140,220,150,260,120"/>
    <circle cx="270" cy="118" r="8" fill="#2EA8FF" stroke="none"/>
  </g>

  <!-- Brand -->
  <text x="600" y="760" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="120" font-weight="700"
        letter-spacing="2"
        fill="#F3F6FF">Klubor</text>

  <text x="600" y="840" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="36" letter-spacing="10"
        fill="#6BB8FF">PREMIUM NETWORK</text>
</svg>